<div class="page-head">
  <h1>Vendors</h1>
  <button class="btn" (click)="newVendor()">+ Tạo vendor</button>
</div>
<div class="err" *ngIf="error">{{ error }}</div>

<div class="filters">
  <label class="muted">Trạng thái:</label>
  <select [ngModel]="status" (ngModelChange)="status = $event; onFilterChange()">
    <option value="">Tất cả</option>
    <option value="INACTIVE">Chờ duyệt (INACTIVE)</option>
    <option value="ACTIVE">Hoạt động (ACTIVE)</option>
    <option value="LOCKED">Đã khoá (LOCKED)</option>
  </select>
</div>

<div class="form" *ngIf="showForm">
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:180px"><label>Email</label><input type="email" [(ngModel)]="form.email"/></div>
    <div style="flex:1;min-width:180px"><label>Mật khẩu</label><input type="text" [(ngModel)]="form.password"/></div>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:180px"><label>Họ tên chủ</label><input type="text" [(ngModel)]="form.fullName"/></div>
    <div style="flex:1;min-width:180px"><label>SĐT</label><input type="text" [(ngModel)]="form.phone"/></div>
  </div>
  <label>Tên khách sạn</label><input type="text" [(ngModel)]="form.hotelName"/>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:140px"><label>Thành phố</label><input type="text" [(ngModel)]="form.city"/></div>
    <div style="flex:2;min-width:180px"><label>Địa chỉ</label><input type="text" [(ngModel)]="form.address"/></div>
    <div style="min-width:90px"><label>Sao</label><input type="number" min="1" max="5" [(ngModel)]="form.starRating"/></div>
  </div>
  <div class="form-actions">
    <button class="btn" (click)="createVendor()" [disabled]="saving || !form.email || !form.password || !form.hotelName">Tạo</button>
    <button class="btn ghost" (click)="cancelForm()">Huỷ</button>
  </div>
</div>

<p class="muted" *ngIf="loading">Đang tải...</p>

<table class="tbl" *ngIf="!loading">
  <thead><tr><th>Email</th><th>Chủ</th><th>Khách sạn</th><th>Trạng thái</th><th></th></tr></thead>
  <tbody>
    <tr *ngFor="let v of pageVendors">
      <td>{{ v.email }}</td>
      <td>{{ v.fullName }}</td>
      <td>{{ v.hotelName }} <span class="muted" *ngIf="v.hotelId">(#{{ v.hotelId }})</span></td>
      <td><span [ngClass]="'badge ' + (v.status | lowercase)">{{ v.status }}</span></td>
      <td class="actions">
        <button class="btn" *ngIf="v.status === 'INACTIVE'" (click)="approve(v)">Duyệt</button>
        <button class="btn danger" *ngIf="v.status === 'INACTIVE'" (click)="reject(v)">Từ chối</button>
        <button class="btn danger" *ngIf="auth.role === 'SUPER_ADMIN' && v.status === 'ACTIVE'" (click)="ban(v)">Ban</button>
        <button class="btn" *ngIf="auth.role === 'SUPER_ADMIN' && v.status === 'LOCKED'" (click)="unban(v)">Gỡ ban</button>
      </td>
    </tr>
    <tr *ngIf="pageVendors.length === 0"><td colspan="5" class="muted">Không có vendor phù hợp.</td></tr>
  </tbody>
</table>

<div class="pager" *ngIf="!loading && filtered.length">
  <button class="btn ghost" (click)="prev()" [disabled]="page === 0">‹ Trước</button>
  <span class="muted">Trang {{ page + 1 }}/{{ totalPages }} · {{ filtered.length }} vendor</span>
  <button class="btn ghost" (click)="next()" [disabled]="page + 1 >= totalPages">Sau ›</button>
</div>
