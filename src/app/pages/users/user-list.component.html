<div class="page-head"><h1>Người dùng</h1></div>

<div class="err" *ngIf="error">{{ error }}</div>

<div class="card" *ngIf="auth.role === 'SUPER_ADMIN'" style="margin-bottom:16px">
  <button class="btn ghost" (click)="showCreate = !showCreate">{{ showCreate ? 'Đóng' : '+ Tạo tài khoản quản trị' }}</button>
  <div *ngIf="showCreate" style="margin-top:12px">
    <div *ngIf="createMsg" style="color:#2e7d32;margin-bottom:8px">{{ createMsg }}</div>
    <div class="filters" style="flex-wrap:wrap;gap:8px">
      <input type="email" [(ngModel)]="newUser.email" placeholder="Email"
             style="padding:8px;border:1px solid #cdd3dd;border-radius:8px"/>
      <input type="text" [(ngModel)]="newUser.fullName" placeholder="Họ tên"
             style="padding:8px;border:1px solid #cdd3dd;border-radius:8px"/>
      <input type="password" [(ngModel)]="newUser.password" placeholder="Mật khẩu (≥6)"
             style="padding:8px;border:1px solid #cdd3dd;border-radius:8px"/>
      <select [(ngModel)]="newUser.role" style="padding:8px;border:1px solid #cdd3dd;border-radius:8px">
        <option value="ADMIN">ADMIN</option>
        <option value="SUPER_ADMIN">SUPER_ADMIN</option>
      </select>
      <button class="btn" (click)="createAdmin()" [disabled]="creating">{{ creating ? 'Đang tạo...' : 'Tạo' }}</button>
    </div>
  </div>
</div>

<div class="filters">
  <input type="search" [(ngModel)]="q" (ngModelChange)="onSearch()"
         placeholder="🔍 Tìm email / họ tên / SĐT..." style="padding:8px 12px;border:1px solid #cdd3dd;border-radius:8px;min-width:240px"/>
  <label class="muted">Vai trò:</label>
  <select [ngModel]="role" (ngModelChange)="role = $event; onFilterChange()">
    <option *ngFor="let r of roles" [value]="r">{{ r || 'Tất cả' }}</option>
  </select>
  <label class="muted">Trạng thái:</label>
  <select [ngModel]="status" (ngModelChange)="status = $event; onFilterChange()">
    <option value="">Tất cả</option>
    <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
  </select>
</div>

<p class="muted" *ngIf="loading">Đang tải...</p>

<table class="tbl" *ngIf="!loading && data">
  <thead>
    <tr><th>ID</th><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of data.content">
      <td>{{ u.id }}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.fullName }}</td>
      <td>
        <select [ngModel]="u.role" (ngModelChange)="changeRole(u, $event)">
          <option *ngFor="let r of roles.slice(1)" [value]="r">{{ r }}</option>
        </select>
      </td>
      <td>
        <select [ngModel]="u.status" (ngModelChange)="changeStatus(u, $event)">
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </td>
    </tr>
    <tr *ngIf="data.content.length === 0"><td colspan="5" class="muted">Không có user.</td></tr>
  </tbody>
</table>

<div class="pager" *ngIf="data">
  <button class="btn ghost" (click)="prev()" [disabled]="page === 0">‹ Trước</button>
  <span class="muted">Trang {{ data.page + 1 }}/{{ data.totalPages || 1 }} · {{ data.totalElements }} user</span>
  <button class="btn ghost" (click)="next()" [disabled]="data.page + 1 >= data.totalPages">Sau ›</button>
</div>
